name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install pinned Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0"

      - name: Validate device smoke-test script
        run: python3 -m py_compile tools/device_protocol_smoke.py

      - name: Create ephemeral CI-only release identity
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/audioshare-ci-release.jks" \
            -storetype JKS \
            -storepass audioshare-ci-only \
            -keypass audioshare-ci-only \
            -alias audioshare-ci \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=AudioShare CI only"
          {
            echo "AUDIOSHARE_KEYSTORE_PATH=$RUNNER_TEMP/audioshare-ci-release.jks"
            echo "AUDIOSHARE_KEYSTORE_PASSWORD=audioshare-ci-only"
            echo "AUDIOSHARE_KEY_ALIAS=audioshare-ci"
            echo "AUDIOSHARE_KEY_PASSWORD=audioshare-ci-only"
          } >> "$GITHUB_ENV"

      - name: Test, lint, and assemble
        run: ./gradlew clean testDebugUnitTest lintRelease assembleDebug assembleRelease --no-daemon --max-workers=1
